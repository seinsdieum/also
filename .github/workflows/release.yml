name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: darwin, goarch: amd64, ext: ""}
          - {goos: darwin, goarch: arm64, ext: ""}
          - {goos: linux, goarch: amd64, ext: ""}
          - {goos: linux, goarch: arm64, ext: ""}
          - {goos: windows, goarch: amd64, ext: ".exe"}
          - {goos: windows, goarch: arm64, ext: ".exe"}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          out="also-${GOOS}-${GOARCH}${{ matrix.ext }}"
          go build -trimpath \
            -ldflags "-s -w -X github.com/seinsdieum/also/internal/also.Commit=${GITHUB_SHA::12} -X github.com/seinsdieum/also/internal/also.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dist/${out}" .
      - uses: actions/upload-artifact@v4
        with:
          name: also-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
