<svg font-family="'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace" xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <style>
      .mono { font-family: "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
      .label { font-size: 12px; letter-spacing: 1.8px; fill: #86868B; }
      .tiny { font-size: 13px; fill: #6E6E73; }
      .body { font-size: 15px; fill: #6E6E73; }
      .ink { fill: #111113; }
      .muted { fill: #86868B; }
      .line { stroke: #E7E7EA; stroke-width: 1; }
      .arrow { stroke: #D2D2D7; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- outer panel: radius 36 = card radius 22 + gap 14 -->
  <rect x="20" y="20" width="1560" height="860" rx="36" fill="#F4F4F6"/>

  <text x="40" y="78" class="mono label">CROSS-HARNESS ARCHITECTURE</text>
  <text x="40" y="124" class="mono ink" font-size="40" font-weight="700" letter-spacing="-1">One package. Native layouts.</text>
  <text x="40" y="154" class="mono body">Encode once, render for every harness, keep one versioned source of truth.</text>

  <!-- LEFT: live project -->
  <rect x="40" y="190" width="420" height="480" rx="22" fill="#FFFFFF"/>
  <text x="70" y="230" class="mono label">LIVE PROJECT</text>
  <text x="70" y="274" class="mono ink" font-size="24" font-weight="600">the native layer</text>
  <text x="70" y="300" class="mono tiny">what the harness actually reads</text>
  <line x1="70" y1="324" x2="430" y2="324" class="line"/>
  <g class="mono" font-size="14" fill="#3F3F46">
    <text x="70" y="362">instructions</text>
    <text x="70" y="390">skills/</text>
    <text x="70" y="418">commands/</text>
    <text x="70" y="446">agents/</text>
    <text x="70" y="474">hooks/</text>
    <text x="70" y="502">mcp/</text>
    <text x="70" y="530">settings</text>
  </g>
  <g class="mono" font-size="12" fill="#86868B">
    <text x="250" y="362">markdown or config</text>
    <text x="250" y="390">reusable</text>
    <text x="250" y="418">workflows</text>
    <text x="250" y="446">specialists</text>
    <text x="250" y="474">lifecycle</text>
    <text x="250" y="502">tools</text>
    <text x="250" y="530">permissions</text>
  </g>
  <line x1="70" y1="566" x2="430" y2="566" class="line"/>
  <text x="70" y="600" class="mono tiny">adopt reads this layer</text>
  <text x="70" y="624" class="mono tiny">install writes it</text>
  <text x="70" y="650" class="mono muted" font-size="12">project or global scope</text>

  <!-- CENTER: also -->
  <rect x="490" y="190" width="620" height="480" rx="22" fill="#FFFFFF"/>
  <text x="520" y="230" class="mono label">ALSO</text>
  <text x="520" y="284" class="mono ink" font-size="42" font-weight="700" letter-spacing="-1">also</text>
  <text x="520" y="312" class="mono tiny">the translator in the middle</text>

  <g class="mono">
    <rect x="520" y="342" width="560" height="50" rx="10" fill="#F4F4F6"/>
    <text x="540" y="373" font-size="13" fill="#6E6E73">01</text>
    <text x="580" y="373" font-size="14" fill="#111113">classify instructions, skills, commands, agents</text>

    <rect x="520" y="404" width="560" height="50" rx="10" fill="#F4F4F6"/>
    <text x="540" y="435" font-size="13" fill="#6E6E73">02</text>
    <text x="580" y="435" font-size="14" fill="#111113">translate hooks, Model Context Protocol, settings</text>

    <rect x="520" y="466" width="560" height="50" rx="10" fill="#F4F4F6"/>
    <text x="540" y="497" font-size="13" fill="#6E6E73">03</text>
    <text x="580" y="497" font-size="14" fill="#111113">plan every file and reversible edit</text>

    <rect x="520" y="528" width="560" height="50" rx="10" fill="#F4F4F6"/>
    <text x="540" y="559" font-size="13" fill="#6E6E73">04</text>
    <text x="580" y="559" font-size="14" fill="#111113">apply transactionally, roll back on failure</text>
  </g>
  <text x="520" y="620" class="mono muted" font-size="12">the plan is computed before anything is written</text>

  <!-- RIGHT: namespace -->
  <rect x="1140" y="190" width="420" height="480" rx="22" fill="#FFFFFF"/>
  <text x="1170" y="230" class="mono label">NAMESPACE</text>
  <text x="1170" y="274" class="mono ink" font-size="24" font-weight="600">the source of truth</text>
  <text x="1170" y="300" class="mono tiny">a remote git repository</text>
  <line x1="1170" y1="324" x2="1530" y2="324" class="line"/>
  <g class="mono" font-size="14" fill="#3F3F46">
    <text x="1170" y="362">packages/</text>
    <text x="1170" y="390">└── code-review/</text>
    <text x="1170" y="418">    ├── also-pkg.json</text>
    <text x="1170" y="446">    └── origin/</text>
  </g>
  <rect x="1170" y="474" width="360" height="70" rx="12" fill="#F4F4F6"/>
  <text x="1188" y="502" class="mono muted" font-size="11">VERSION TAGS</text>
  <text x="1188" y="526" class="mono ink" font-size="12">also/code-review/3f9a6c2e</text>
  <text x="1188" y="544" class="mono ink" font-size="12">also/code-review/8b21d0f4</text>
  <line x1="1170" y1="576" x2="1530" y2="576" class="line"/>
  <text x="1170" y="610" class="mono tiny">push writes one live tree</text>
  <text x="1170" y="632" class="mono tiny">history stays immutable</text>
  <text x="1170" y="656" class="mono muted" font-size="12">clone is an internal cache</text>

  <!-- arrows -->
  <path d="M460 430H490" class="arrow"/>
  <path d="M486 425l4 5-4 5" class="arrow" fill="none"/>
  <path d="M1110 430H1140" class="arrow"/>
  <path d="M1136 425l4 5-4 5" class="arrow" fill="none"/>

  <!-- BUILT-IN ADAPTERS -->
  <rect x="40" y="700" width="1520" height="150" rx="22" fill="#FFFFFF"/>
  <text x="70" y="738" class="mono label">BUILT-IN ADAPTERS</text>
  <text x="70" y="782" class="mono tiny">ready to install without compiling code</text>
  <g class="mono">
    <rect x="420" y="734" width="240" height="82" rx="14" fill="#F4F4F6"/>
    <circle cx="448" cy="775" r="4" fill="#3B82F6"/>
    <text x="464" y="780" font-size="15" fill="#111113">claude</text>
    <text x="464" y="800" font-size="11" fill="#86868B">built-in</text>

    <rect x="676" y="734" width="240" height="82" rx="14" fill="#F4F4F6"/>
    <circle cx="704" cy="775" r="4" fill="#C7C7CC"/>
    <text x="720" y="780" font-size="15" fill="#111113">codex</text>
    <text x="720" y="800" font-size="11" fill="#86868B">built-in</text>

    <rect x="932" y="734" width="240" height="82" rx="14" fill="#F4F4F6"/>
    <circle cx="960" cy="775" r="4" fill="#C7C7CC"/>
    <text x="976" y="780" font-size="15" fill="#111113">opencode</text>
    <text x="976" y="800" font-size="11" fill="#86868B">built-in</text>

    <rect x="1188" y="734" width="240" height="82" rx="14" fill="#F4F4F6"/>
    <circle cx="1216" cy="775" r="4" fill="#C7C7CC"/>
    <text x="1232" y="780" font-size="15" fill="#111113">qwen</text>
    <text x="1232" y="800" font-size="11" fill="#86868B">built-in</text>
  </g>
  <text x="1444" y="722" text-anchor="end" class="mono" font-size="11" fill="#86868B">+ declarative community adapters</text>
</svg>
