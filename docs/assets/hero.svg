<svg font-family="'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace" xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#1D1D1F" flood-opacity="0.05"/>
    </filter>
    <style>
      .label { font-size: 12px; letter-spacing: 2px; fill: #86868B; }
      .body { font-size: 15px; fill: #6E6E73; }
      .ink { fill: #111113; }
      .muted { fill: #86868B; }
    </style>
  </defs>

  <g font-family="Menlo, Consolas, monospace">

  <!-- outer panel: radius 36 = card radius 22 + gap 14 -->
  <rect x="20" y="20" width="1560" height="960" rx="36" fill="#F4F4F6"/>

  <!-- ===== LEFT FEATURES ===== -->
  <rect x="34" y="34" width="360" height="300" rx="22" fill="#FFFFFF"/>
  <text x="64" y="74" class="mono label">ADAPTERS</text>
  <text x="64" y="190" class="mono ink" font-size="110" font-weight="700" letter-spacing="-4">4</text>
  <text x="148" y="190" class="mono ink" font-size="30" font-weight="600">built-in</text>
  <text x="64" y="232" class="mono body">+ declarative JSON</text>
  <text x="64" y="254" class="mono body">for community harnesses</text>

  <rect x="34" y="348" width="360" height="300" rx="22" fill="#FFFFFF"/>
  <text x="64" y="388" class="mono label">VERSIONED</text>
  <text x="64" y="504" class="mono ink" font-size="110" font-weight="700" letter-spacing="-4">16</text>
  <text x="200" y="504" class="mono ink" font-size="26" font-weight="600">characters</text>
  <text x="64" y="546" class="mono body">content digest</text>
  <text x="64" y="568" class="mono body">immutable git tags</text>

  <rect x="34" y="662" width="360" height="304" rx="22" fill="#FFFFFF"/>
  <text x="64" y="702" class="mono label">REVERSIBLE</text>
  <text x="64" y="806" class="mono ink" font-size="64" font-weight="700" letter-spacing="-3">UNDO</text>
  <text x="64" y="848" class="mono body">every file and edit</text>
  <text x="64" y="870" class="mono body">is tracked</text>

  <!-- ===== CENTER HERO ===== -->
  <rect x="408" y="34" width="784" height="932" rx="22" fill="#FFFFFF"/>

  <text x="800" y="106" text-anchor="middle" class="mono label">PORTABLE AI INFRASTRUCTURE</text>

  <text x="800" y="520" text-anchor="middle" class="mono" fill="#111113" font-size="220" font-weight="700" letter-spacing="-10">also</text>
  <line x1="744" y1="562" x2="856" y2="562" stroke="#3B82F6" stroke-width="5" stroke-linecap="round"/>

  <text x="800" y="624" text-anchor="middle" class="mono" font-size="30" fill="#6E6E73">one package. every harness.</text>

  <rect x="560" y="690" width="480" height="62" rx="14" fill="#F4F4F6"/>
  <text x="588" y="729" class="mono" fill="#3B82F6" font-size="18">$</text>
  <text x="608" y="729" class="mono" fill="#111113" font-size="18">also install code-review</text>

  <text x="800" y="810" text-anchor="middle" class="mono body">version once · render everywhere</text>

  <!-- ===== RIGHT FEATURES ===== -->
  <rect x="1206" y="34" width="360" height="300" rx="22" fill="#FFFFFF"/>
  <text x="1236" y="74" class="mono label">PARTIAL INSTALL</text>
  <text x="1236" y="190" class="mono ink" font-size="64" font-weight="700" letter-spacing="-3">PARTS</text>
  <text x="1236" y="232" class="mono body">install only the pieces</text>
  <text x="1236" y="254" class="mono body">you actually need</text>

  <rect x="1206" y="348" width="360" height="300" rx="22" fill="#FFFFFF"/>
  <text x="1236" y="388" class="mono label">NAMESPACE</text>
  <text x="1236" y="504" class="mono ink" font-size="72" font-weight="700" letter-spacing="-4">GIT</text>
  <text x="1236" y="546" class="mono body">one remote repository</text>
  <text x="1236" y="568" class="mono body">one source of truth</text>

  <rect x="1206" y="662" width="360" height="304" rx="22" fill="#FFFFFF"/>
  <text x="1236" y="702" class="mono label">OPERATIONS</text>
  <text x="1236" y="806" class="mono ink" font-size="64" font-weight="700" letter-spacing="-2">doctor</text>
  <text x="1236" y="848" class="mono body">verify, repair and update</text>
  <text x="1236" y="870" class="mono body">without guesswork</text>
  </g>
</svg>
