    <text x="1385" y="344" fill="#0F172A" font-size="23" font-weight="600">Codex CLI</text>
    <text x="1385" y="374" fill="#64748B" font-size="15">AGENTS.md · .codex</text>
    <text x="215" y="544" fill="#0F172A" font-size="23" font-weight="600">OpenCode</text>
