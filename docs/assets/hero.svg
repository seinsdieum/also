<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>also — version once, run anywhere</title>
  <desc>also is a command-line interface that stores AI infrastructure once and renders it into the native layout of every harness.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0071E3" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0071E3" stop-opacity="0"/>
    </radialGradient>
    <style>
      .bg { fill: #F5F5F7; }
      .card { fill: #FFFFFF; }
      .edge { stroke: #E5E5EA; stroke-width: 1; }
      .hair { stroke: #E5E5EA; stroke-width: 1; }
      .ink { fill: #1D1D1F; }
      .muted { fill: #6E6E73; }
      .faint { fill: #86868B; }
      .chip { fill: #F2F2F5; }
      .accent { fill: #0071E3; }
      .accentStroke { stroke: #0071E3; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0A0A0B; }
        .card { fill: #151517; }
        .edge { stroke: #2A2A2D; }
        .hair { stroke: #2A2A2D; }
        .ink { fill: #F5F5F7; }
        .muted { fill: #A1A1A6; }
        .faint { fill: #8E8E93; }
        .chip { fill: #1E1E21; }
        .accent { fill: #0A84FF; }
        .accentStroke { stroke: #0A84FF; }
      }
    </style>
  </defs>

  <rect x="24" y="24" width="1552" height="852" rx="48" class="bg"/>
  <rect x="24" y="24" width="1552" height="852" rx="48" class="edge"/>

  <!-- ============ LEFT ============ -->
  <rect x="56" y="56" width="388" height="360" rx="28" class="card"/>
  <rect x="56" y="56" width="388" height="360" rx="28" class="edge"/>
  <text x="92" y="106" font-size="13" font-weight="600" letter-spacing="1.6" class="faint">ONE PACKAGE</text>
  <text x="92" y="182" font-size="40" font-weight="600" letter-spacing="-1" class="ink">Harness</text>
  <text x="92" y="228" font-size="40" font-weight="600" letter-spacing="-1" class="ink">agnostic</text>
  <text x="92" y="288" font-size="19" class="muted">The same infrastructure is</text>
  <text x="92" y="316" font-size="19" class="muted">written once and rendered in</text>
  <text x="92" y="344" font-size="19" class="muted">the native layout of each harness.</text>

  <rect x="56" y="440" width="388" height="404" rx="28" class="card"/>
  <rect x="56" y="440" width="388" height="404" rx="28" class="edge"/>
  <text x="92" y="490" font-size="13" font-weight="600" letter-spacing="1.6" class="faint">YOUR REPOSITORY</text>
  <text x="92" y="566" font-size="40" font-weight="600" letter-spacing="-1" class="ink">Remote</text>
  <text x="92" y="612" font-size="40" font-weight="600" letter-spacing="-1" class="ink">namespaces</text>
  <text x="92" y="672" font-size="19" class="muted">Infrastructure lives in a git</text>
  <text x="92" y="700" font-size="19" class="muted">repository that you own and</text>
  <text x="92" y="728" font-size="19" class="muted">control, not on a vendor server.</text>
  <line x1="92" y1="764" x2="408" y2="764" class="hair"/>
  <text x="92" y="800" font-size="16" class="faint">connect once, then install anywhere</text>

  <!-- ============ RIGHT ============ -->
  <rect x="1156" y="56" width="388" height="360" rx="28" class="card"/>
  <rect x="1156" y="56" width="388" height="360" rx="28" class="edge"/>
  <text x="1192" y="106" font-size="13" font-weight="600" letter-spacing="1.6" class="faint">EVERY CHANGE</text>
  <text x="1192" y="182" font-size="40" font-weight="600" letter-spacing="-1" class="ink">Content</text>
  <text x="1192" y="228" font-size="40" font-weight="600" letter-spacing="-1" class="ink">versioned</text>
  <text x="1192" y="288" font-size="19" class="muted">Every version has a stable</text>
  <text x="1192" y="316" font-size="19" class="muted">address, so an upgrade or a</text>
  <text x="1192" y="344" font-size="19" class="muted">rollback is exact and repeatable.</text>

  <rect x="1156" y="440" width="388" height="404" rx="28" class="card"/>
  <rect x="1156" y="440" width="388" height="404" rx="28" class="edge"/>
  <text x="1192" y="490" font-size="13" font-weight="600" letter-spacing="1.6" class="faint">EXISTING PROJECTS</text>
  <text x="1192" y="566" font-size="40" font-weight="600" letter-spacing="-1" class="ink">Adopt</text>
  <text x="1192" y="612" font-size="40" font-weight="600" letter-spacing="-1" class="ink">anything</text>
  <text x="1192" y="672" font-size="19" class="muted">Turn infrastructure you</text>
  <text x="1192" y="700" font-size="19" class="muted">already use into a portable</text>
  <text x="1192" y="728" font-size="19" class="muted">package with one command.</text>
  <line x1="1192" y1="764" x2="1508" y2="764" class="hair"/>
  <text x="1192" y="800" font-size="16" class="faint">no rewrite, no vendor lock-in</text>

  <!-- ============ CENTER ============ -->
  <rect x="468" y="56" width="664" height="788" rx="28" class="card"/>
  <rect x="468" y="56" width="664" height="788" rx="28" class="edge"/>
  <ellipse cx="800" cy="368" rx="270" ry="170" fill="url(#glow)"/>

  <text x="800" y="132" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="2" class="faint">AI INFRASTRUCTURE, VERSIONED</text>

  <text x="800" y="400" text-anchor="middle" font-size="210" font-weight="700" letter-spacing="-10" class="ink">also</text>
  <line x1="742" y1="440" x2="858" y2="440" class="accentStroke" stroke-width="5" stroke-linecap="round"/>

  <text x="800" y="510" text-anchor="middle" font-size="36" font-weight="500" letter-spacing="-0.4" class="ink">Version once. Run anywhere.</text>

  <rect x="536" y="560" width="528" height="72" rx="18" class="chip"/>
  <text x="566" y="605" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" class="accent">$</text>
  <text x="590" y="605" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" class="ink">also install code-review</text>

  <text x="800" y="696" text-anchor="middle" font-size="17" class="muted">instructions, skills, commands, agents, hooks and tool servers</text>

  <line x1="600" y1="742" x2="1000" y2="742" class="hair"/>

  <g transform="translate(652, 786)">
    <circle cx="5" cy="0" r="5" class="accent"/>
    <text x="24" y="6" font-size="20" font-weight="500" class="ink">one source of truth</text>
  </g>
  <text x="800" y="822" text-anchor="middle" font-size="15" class="faint">git-backed, for every harness</text>
</svg>
